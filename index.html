<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { background:#0a0a0a; color:#fff; font-family:sans-serif; display:flex;
         justify-content:center; align-items:center; min-height:100vh; margin:0;
         text-align:center; padding:20px; box-sizing:border-box; }
  .box { max-width:420px; }
  .spinner { border:4px solid #333; border-top:4px solid #4ade80; border-radius:50%;
             width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto; }
  @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
  #status { line-height:1.8; font-size:15px; margin-top:15px; }
  .vpn-notice {
    background:#1a1a1a;
    border:1px solid #f59e0b;
    border-radius:10px;
    padding:15px;
    margin:20px 0;
    text-align:right;
    font-size:14px;
    line-height:1.9;
  }
  .vpn-notice .title {
    color:#f59e0b;
    font-weight:bold;
    font-size:16px;
    margin-bottom:8px;
    text-align:center;
  }
  .vpn-notice .step {
    color:#ddd;
    padding-right:5px;
  }
  .vpn-notice .step .num {
    display:inline-block;
    width:22px;
    height:22px;
    line-height:22px;
    text-align:center;
    background:#f59e0b;
    color:#000;
    border-radius:50%;
    font-size:12px;
    font-weight:bold;
    margin-left:6px;
  }
</style>
</head>
<body>
<div class="box">
  <h2 id="title">⏳ در حال تأیید هویت...</h2>

  <div class="vpn-notice" id="vpn-notice">
    <div class="title">🌐 لطفاً VPN خود را روشن کنید</div>
    <div class="step"><span class="num">۱</span> VPN را روشن کنید</div>
    <div class="step"><span class="num">۲</span> منتظر بمانید تا تأیید شود</div>
    <div class="step"><span class="num">۳</span> دکمه‌ی زیر را بزنید تا دوباره تلاش شود</div>
  </div>

  <div class="spinner" id="spinner"></div>
  <p id="status">لطفاً صبر کنید...</p>
  <button id="retry-btn" style="display:none; background:#4ade80; color:#000; border:none;
          padding:12px 28px; border-radius:8px; font-size:15px; font-weight:bold;
          cursor:pointer; margin-top:15px;">🔄 تلاش مجدد</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById('status');
  const spinnerEl = document.getElementById('spinner');
  const retryBtn = document.getElementById('retry-btn');
  const titleEl = document.getElementById('title');
  const vpnNotice = document.getElementById('vpn-notice');

  const BACKEND_URL = 'https://else1234.pythonanywhere.com/verify';
  const TIMEOUT_MS = 10000;

  function tryVerify() {
    // ریست
    spinnerEl.style.display = 'block';
    retryBtn.style.display = 'none';
    titleEl.textContent = '⏳ در حال تأیید هویت...';
    statusEl.innerHTML = 'لطفاً صبر کنید...';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData: tg.initData,
        user_id: tg.initDataUnsafe?.user?.id || null,
        device: navigator.userAgent
      }),
      signal: controller.signal
    })
    .then(res => res.json())
    .then(data => {
      clearTimeout(timeoutId);
      spinnerEl.style.display = 'none';

      if (data.status === 'APPROVED') {
        titleEl.textContent = '✅ تأیید شد';
        vpnNotice.style.display = 'none';
        statusEl.innerHTML = '✅ تأیید شد!<br>برگرد به بات.';
        setTimeout(() => tg.close(), 2500);
      } else if (data.status === 'PENDING') {
        titleEl.textContent = '⏳ در انتظار تأیید ادمین';
        vpnNotice.style.display = 'none';
        statusEl.innerHTML = '⏳ درخواست شما ثبت شد.<br><br>در انتظار تأیید ادمین...<br>پس از تأیید، به شما اطلاع داده می‌شود.';
        setTimeout(() => tg.close(), 4500);
      } else if (data.status === 'REJECTED') {
        titleEl.textContent = '❌ رد شد';
        vpnNotice.style.display = 'none';
        if (data.reason === 'already_rejected') {
          statusEl.innerHTML = '❌ درخواست شما قبلاً رد شده است.<br><br>برای پیگیری با ادمین تماس بگیرید.';
        } else {
          statusEl.innerHTML = '❌ ' + (data.error || 'دسترسی رد شد.');
        }
        setTimeout(() => tg.close(), 5000);
      } else {
        titleEl.textContent = '❌ خطا';
        statusEl.innerHTML = '❌ ' + (data.error || 'خطای نامشخص');
        setTimeout(() => tg.close(), 3000);
      }
    })
    .catch(err => {
      clearTimeout(timeoutId);
      spinnerEl.style.display = 'none';

      // VPN notice رو نگه دار و پیام خطا بده
      vpnNotice.style.display = 'block';

      if (err.name === 'AbortError') {
        titleEl.textContent = '⚠️ سرور پاسخ نداد';
        statusEl.innerHTML = '⏱ زمان انتظار به پایان رسید.<br>لطفاً مطمئن شوید VPN روشن است و دوباره تلاش کنید.';
      } else {
        titleEl.textContent = '⚠️ خطای اتصال';
        statusEl.innerHTML = '❌ به سرور وصل نشدیم.<br>لطفاً VPN خود را روشن کنید و دوباره تلاش کنید.';
      }
      retryBtn.style.display = 'inline-block';
    });
  }

  retryBtn.addEventListener('click', tryVerify);

  // شروع خودکار
  tryVerify();
</script>
</body>
</html>
