<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .box { max-width: 400px; }
  .spinner {
    border: 4px solid #333;
    border-top: 4px solid #4ade80;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  #status { line-height: 1.8; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <h2>⏳ در حال تأیید هویت...</h2>
  <div class="spinner" id="spinner"></div>
  <p id="status">لطفاً صبر کنید...</p>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById('status');
  const spinnerEl = document.getElementById('spinner');

  const BACKEND_URL = 'https://else1234.pythonanywhere.com/verify';

  fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      initData: tg.initData,
      user_id: tg.initDataUnsafe?.user?.id || null,
      device: navigator.userAgent
    })
  })
  .then(res => res.json())
  .then(data => {
    spinnerEl.style.display = 'none';
    if (data.status === 'APPROVED') {
      statusEl.innerHTML = '✅ تأیید شد!<br>در حال بستن...';
      setTimeout(() => tg.close(), 1500);
    } else if (data.status === 'REJECTED') {
      if (data.reason === 'non_iran_ip') {
        statusEl.innerHTML = '⚠️ فقط کاربران داخل ایران می‌توانند وارد شوند.<br><br>لطفاً VPN خود را خاموش کنید و دوباره تلاش کنید.';
      } else {
        statusEl.innerHTML = '❌ ' + (data.error || 'دسترسی رد شد.');
      }
      setTimeout(() => tg.close(), 4000);
    } else {
      statusEl.innerHTML = '❌ ' + (data.error || 'خطای نامشخص');
      setTimeout(() => tg.close(), 3000);
    }
  })
  .catch(err => {
    spinnerEl.style.display = 'none';
    statusEl.innerHTML = '❌ خطای شبکه<br>دوباره تلاش کنید.';
    setTimeout(() => tg.close(), 3000);
  });
</script>
</body>
</html>
