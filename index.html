<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    direction: rtl;
  }
  .box { max-width: 400px; }
  h2 { font-size: 20px; margin-bottom: 25px; direction: rtl; }
  .spinner {
    border: 4px solid #333;
    border-top: 4px solid #4ade80;
    border-radius: 50%;
    width: 40px; height: 40px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  #status { line-height: 1.9; font-size: 15px; margin-top: 15px; direction: rtl; }
  .vpn-hint { color: #f59e0b; font-size: 14px; line-height: 1.8; margin-top: 8px; direction: rtl; }
  #retry-btn {
    display: none; background: #4ade80; color: #000; border: none;
    padding: 12px 28px; border-radius: 8px; font-size: 15px;
    font-weight: bold; cursor: pointer; margin-top: 20px;
    font-family: Tahoma, Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="box">
  <h2 id="title">در حال تأیید هویت...</h2>
  <div class="spinner" id="spinner"></div>
  <p id="status">لطفاً صبر کنید...</p>
  <p class="vpn-hint" id="vpn-hint">در صورت برقراری نشدن اتصال، VPN خود را روشن کنید</p>
  <button id="retry-btn">تلاش مجدد</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById('status');
  const spinnerEl = document.getElementById('spinner');
  const retryBtn = document.getElementById('retry-btn');
  const titleEl = document.getElementById('title');
  const vpnHint = document.getElementById('vpn-hint');

  const BACKEND_URL = 'https://else1234.pythonanywhere.com/verify';
  const TIMEOUT_MS = 10000;

  function tryVerify() {
    spinnerEl.style.display = 'block';
    retryBtn.style.display = 'none';
    vpnHint.style.display = 'block';
    titleEl.textContent = 'در حال تأیید هویت...';
    statusEl.textContent = 'لطفاً صبر کنید...';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData: tg.initData,
        user_id: tg.initDataUnsafe?.user?.id || null,
        device: navigator.userAgent,
        screen_w: window.screen.width,
        screen_h: window.screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || ''
      }),
      signal: controller.signal
    })
    .then(res => res.json())
    .then(data => {
      clearTimeout(timeoutId);
      spinnerEl.style.display = 'none';
      vpnHint.style.display = 'none';

      if (data.status === 'APPROVED') {
        titleEl.textContent = 'تأیید شد';
        statusEl.textContent = 'به بات بازگردید.';
        setTimeout(() => tg.close(), 2000);
      } else if (data.status === 'PENDING') {
        titleEl.textContent = 'در انتظار تأیید ادمین';
        statusEl.innerHTML = 'درخواست شما ثبت شد.<br>پس از تأیید، به شما اطلاع داده می‌شود.';
        setTimeout(() => tg.close(), 4000);
      } else if (data.status === 'REJECTED') {
        titleEl.textContent = 'رد شد';
        if (data.reason === 'already_rejected') {
          statusEl.innerHTML = 'درخواست شما قبلاً رد شده است.<br>برای پیگیری با ادمین تماس بگیرید.';
        } else {
          statusEl.textContent = data.error || 'دسترسی رد شد.';
        }
        setTimeout(() => tg.close(), 5000);
      } else {
        titleEl.textContent = 'خطا';
        statusEl.textContent = data.error || 'خطای نامشخص';
        setTimeout(() => tg.close(), 3000);
      }
    })
    .catch(err => {
      clearTimeout(timeoutId);
      spinnerEl.style.display = 'none';
      titleEl.textContent = 'اتصال برقرار نشد';
      statusEl.textContent = 'لطفاً VPN خود را روشن کنید و دوباره تلاش کنید.';
      vpnHint.style.display = 'none';
      retryBtn.style.display = 'inline-block';
    });
  }

  retryBtn.addEventListener('click', tryVerify);
  tryVerify();
</script>
</body>
</html>
