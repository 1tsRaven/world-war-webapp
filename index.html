<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { background:#0a0a0a; color:#fff; font-family:sans-serif; display:flex;
         justify-content:center; align-items:center; min-height:100vh; margin:0;
         text-align:center; padding:20px; box-sizing:border-box; }
  .box { max-width:400px; }
  h2 { font-size:20px; margin-bottom:25px; }
  .spinner { border:4px solid #333; border-top:4px solid #4ade80; border-radius:50%;
             width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto; }
  @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
  #status { line-height:1.9; font-size:15px; margin-top:15px; }
  #retry-btn { display:none; background:#4ade80; color:#000; border:none;
               padding:12px 28px; border-radius:8px; font-size:15px; font-weight:bold;
               cursor:pointer; margin-top:20px; }
</style>
</head>
<body>
<div class="box">
  <h2 id="title">⏳ در حال تأیید هویت...</h2>
  <div class="spinner" id="spinner"></div>
  <p id="status">لطفاً صبر کنید...</p>
  <button id="retry-btn">🔄 تلاش مجدد</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById('status');
  const spinnerEl = document.getElementById('spinner');
  const retryBtn = document.getElementById('retry-btn');
  const titleEl = document.getElementById('title');

  const BACKEND_URL = 'https://else1234.pythonanywhere.com/verify';
  const TIMEOUT_MS = 10000;

  function tryVerify() {
    spinnerEl.style.display = 'block';
    retryBtn.style.display = 'none';
    titleEl.textContent = '⏳ در حال تأیید هویت...';
    statusEl.innerHTML = 'لطفاً صبر کنید...';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData: tg.initData,
        user_id: tg.initDataUnsafe?.user?.id || null,
        device: navigator.userAgent
      }),
      signal: controller.signal
    })
    .then(res => res.json())
    .then(data => {
      clearTimeout(timeoutId);
      spinnerEl.style.display = 'none';

      if (data.status === 'APPROVED') {
        titleEl.textContent = '✅ تأیید شد';
        statusEl.innerHTML = 'برگرد به بات.';
        setTimeout(() => tg.close(), 2000);
      } else if (data.status === 'PENDING') {
        titleEl.textContent = '⏳ در انتظار تأیید ادمین';
        statusEl.innerHTML = 'درخواست شما ثبت شد.<br>پس از تأیید، به شما اطلاع داده می‌شود.';
        setTimeout(() => tg.close(), 4000);
      } else if (data.status === 'REJECTED') {
        titleEl.textContent = '❌ رد شد';
        statusEl.innerHTML = data.reason === 'already_rejected'
          ? 'درخواست شما قبلاً رد شده است.<br>برای پیگیری با ادمین تماس بگیرید.'
          : (data.error || 'دسترسی رد شد.');
        setTimeout(() => tg.close(), 5000);
      } else {
        titleEl.textContent = '❌ خطا';
        statusEl.innerHTML = data.error || 'خطای نامشخص';
        setTimeout(() => tg.close(), 3000);
      }
    })
    .catch(err => {
      clearTimeout(timeoutId);
      spinnerEl.style.display = 'none';
      titleEl.textContent = '⚠️ اتصال برقرار نشد';
      statusEl.innerHTML = 'لطفاً VPN خود را روشن کنید و دوباره تلاش کنید.';
      retryBtn.style.display = 'inline-block';
    });
  }

  retryBtn.addEventListener('click', tryVerify);
  tryVerify();
</script>
</body>
</html>
