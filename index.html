<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  .box {
    padding: 30px;
  }
  .spinner {
    border: 4px solid #333;
    border-top: 4px solid #4ade80;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="box">
  <h2>⏳ در حال تأیید هویت...</h2>
  <div class="spinner"></div>
  <p id="status">لطفاً صبر کنید...</p>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById('status');

  // آدرس بک‌اند پایتون‌انیور خودت رو اینجا بذار
  const BACKEND_URL = 'https://else1234.pythonanywhere.com/verify';

  fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      initData: tg.initData,
      user_id: tg.initDataUnsafe?.user?.id || null
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.ok) {
      statusEl.textContent = '✅ تأیید شد!';
      setTimeout(() => tg.close(), 1000);
    } else {
      statusEl.textContent = '❌ ' + (data.error || 'خطا');
      setTimeout(() => tg.close(), 2000);
    }
  })
  .catch(err => {
    statusEl.textContent = '❌ خطای شبکه';
    setTimeout(() => tg.close(), 2000);
  });
</script>
</body>
</html>
